spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=pagos-service
spring.cloud.gateway.routes[1].uri=lb://pagos-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/pagos/**

spring.cloud.gateway.routes[2].id=recomendaciones-service
spring.cloud.gateway.routes[2].uri=lb://recomendaciones-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/recomendaciones/**
